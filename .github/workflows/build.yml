name: Build Custom WSL2 Kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 333
    env:
      CCACHE_DIR: /tmp/ccache
    steps:
      - name: Checkout My Config Repo
        uses: actions/checkout@v4
        with:
          repository: quantrimang123/WSL2-Linux-Kernel
          path: my_config_folder 
          token: ${{ secrets.GH_PAT }}
          
      - name: Install Dependencies
        run: |

          pacman -Syu --noconfirm
          packages=(git gcc base-devel bc bison flex pahole libelf elfutils openssl zstd kmod cpio gawk  llvm clang lld ccache patch curl pigz xz lz4 linux-headers glibc gcc-libs zlib perl python python-pip findutils grep sed coreutils util-linux linux-firmware procps-ng iproute2 dracut)
          for pkg in "${packages[@]}"; do pacman -S --noconfirm "$pkg"; done
          
          curl -O https://archive.archlinux.org/packages/g/gcc15/gcc15-15.2.1+r934+gbcd3e3ff5aa7-1-x86_64.pkg.tar.zst
          pacman -U --noconfirm gcc15-15.2.1+r934+gbcd3e3ff5aa7-1-x86_64.pkg.tar.zst
          
          echo "Phiên bản gcc là:"
          gcc-15 --version
          echo "Phiên bản pahole là :"
          pahole --version
      - name: Setup ccache
        run: |
          export PATH="/usr/lib/ccache/bin:$PATH"
          ccache --version
          mkdir -p /tmp/ccache
          echo "CCACHE_DIR=/tmp/ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-kernel-k501lb-${{ github.sha }}
          restore-keys: ${{ runner.os }}-kernel-k501lb-
      - name: Build Kernel
        run: |
          git clone --depth=1 -b linux-msft-wsl-6.6.y https://github.com/microsoft/WSL2-Linux-Kernel.git
          
          cd WSL2-Linux-Kernel
          
          echo "Phiên bản Kernel hiện tại là:"
          make kernelversion
          
          export CC="ccache gcc-15"
          export CXX="ccache g++-15"
          export AR="gcc-ar-15"
          export NM="gcc-nm-15"
          export RANLIB="gcc-ranlib-15"
          
          unset LLVM
          unset LLVM_IAS
          unset LD
          
          make mrproper
          cp Microsoft/config-wsl .config
          
          if [ ! -f .config ]; then
              echo ".config không tồn tại, kiểm tra lại lệnh cấu hình!"
              exit 1
          fi
          
          if [ -d "Microsoft" ]; then
              make KCONFIG_CONFIG=Microsoft/config-wsl kvm_guest.config
              cp Microsoft/config-wsl .config
          fi
          
          ./scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/my_config_folder/my_config.cfg
          ./scripts/config --enable CONFIG_DEBUG_INFO
          ./scripts/config --enable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_GCC_PLUGIN_RANDSTRUCT
          
          make olddefconfig
          make prepare
          
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" \) -exec sed -i 's/-Werror//g' {} +

          echo "--- Đang càn quét và xóa bỏ -Werror trong Makefile/Kbuild ---"
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" -o -name "*.mk" -o -name "*.config" \) \
          -exec perl -pi -e 's/-Werror//g' {} 

          echo "--- Đang tinh chỉnh cấu hình Kernel để triệt tiêu kiểm tra gắt gao ---"
          ./scripts/config --disable CONFIG_WERROR
          ./scripts/config --disable CONFIG_GCC_PLUGIN_RANDSTRUCT
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF

          echo "--- Thiết lập rào chắn Compiler Flags ---"
          export KCFLAGS="-w -fpermissive -Wno-error -Wno-discarded-qualifiers -Wno-maybe-uninitialized -Wno-unused-but-set-variable -Wno-return-type"
          export KBUILD_CFLAGS="-w -fpermissive -Wno-error"
          export WERROR=0
          export HOSTCFLAGS="-w -Wno-error"
          export USERCFLAGS="-w -Wno-error"
          export EXTRA_CFLAGS="-w -fpermissive -Wno-error"
          
          unset LLVM
          unset LLVM_IAS
          unset LD
          
          find tools/ -name Makefile -exec sed -i 's/-Werror//g' {} +
          find tools/ -name "libbpf.c" -exec sed -i "s/next_path = strchr(s, ':')/next_path = (char *)strchr(s, ':')/g" {} +
          find tools/ -type f -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          
          echo "--- Hệ thống đã sẵn sàng. Bắt đầu build với quyền cực đoan! ---" 
          make CC="ccache gcc-15" \
               CXX="ccache g++-15" \
               AR="gcc-ar-15" \
               NM="gcc-nm-15" \
               RANLIB="gcc-ranlib-15" \
               WERROR=0 \
               KCFLAGS="$KCFLAGS" \
               HOSTCFLAGS="$HOSTCFLAGS" \
               USERCFLAGS="$USERCFLAGS" \
               EXTRA_CFLAGS="-w -Wno-error" \
               -j$(nproc)


      - name: Process and Package All Artifacts
        run: |
          cd WSL2-Linux-Kernel
          set -e
          mkdir -p /tmp/wsl_out
          cp arch/x86/boot/bzImage /tmp/wsl_out/bzImage
          cp vmlinux /tmp/wsl_out/vmlinux
          cp System.map /tmp/wsl_out/System.map
          cp .config /tmp/wsl_out/config.bak

          mkdir -p /tmp/wsl_out/lib/modules
          make INSTALL_MOD_PATH=/tmp/wsl_out modules_install
          
          if [ -d "firmware" ]; then
              mkdir -p /tmp/wsl_out/lib/firmware
              cp -r firmware/* /tmp/wsl_out/lib/firmware/
          fi

          find /tmp/wsl_out/lib/modules -name "*.ko" -print0 | xargs -0 -P $(nproc) -I {} strip --strip-debug {}

          if [ -d "/tmp/wsl_out/lib" ]; then
              cd /tmp/wsl_out
              tar -cf - lib/ | pigz -9 -p$(nproc) > modules_firmware.tar.gz
          fi
          
          pigz -9 -p$(nproc) /tmp/wsl_out/vmlinux
          
          find /tmp/wsl_out -name "build" -type l -delete
          find /tmp/wsl_out -name "source" -type l -delete

          df -h
          ls -lh /tmp/wsl_out/
          
      - name: Create Initrd (Hyper-V Safe)
        run: |
          KVER=$(cd /tmp/wsl_out/lib/modules && ls -d */ | cut -f1 -d'/')
          
          if [ -z "$KVER" ]; then
              echo "Lỗi: Không tìm thấy thư mục module nào!"
              exit 1
          fi
          
          HV_DRIVERS=$(find /tmp/wsl_out/lib/modules/"$KVER"/kernel/drivers/hv/ -name "*.ko" -exec basename {} .ko \; 2>/dev/null | tr '\n' ' ')
          
          cd /tmp/wsl_out
                    
          dracut --verbose --force \
            --kver "$KVER" \
            --kmoddir /tmp/wsl_out/lib/modules/ \
            --add "kernel-modules" \
            --add-drivers "$HV_DRIVERS hv_vmbus hv_netvsc hv_storvsc hv_utils hv_sock hv_balloon hv_kbd hv_mouse" \
            --no-hostonly \
            --no-hostonly-cmdline \
            --install "lsmod modprobe insmod" \
            --omit "network" \
            initrd.img

      - name: Upload Final Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WSL2-Kernel-6.6-Custom
          path: |
            /tmp/wsl_out/bzImage
            /tmp/wsl_out/initrd.img
            /tmp/wsl_out/modules_firmware.tar.gz
            /tmp/wsl_out/System.map
            /tmp/wsl_out/vmlinux.gz
            /tmp/wsl_out/config.bak
          retention-days: 67
